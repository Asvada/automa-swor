<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Outer Rim Automa Simulator</title>
<!--    <link rel="stylesheet" href="./assets/css/main.css">-->
    <script src="./assets/js/jquery-3.7.1.min.js"></script>
    <script>
        // Debug mode is opt-in per load: ?debug (or ?debug=1) on the query string.
        // It lifts the player cap, drops the setup confirmations, validates the card
        // data on load, and makes the AI decks deterministic - see main.js.
        //   ?debug=whole-deck          every card on one page, both locales + scans
        //   ?debug&ai=han,boba&mode=base&locale=en&human=erso   seat a table and start
        const debug = new URLSearchParams(location.search).has('debug');
        const debugWholeDeck = new URLSearchParams(location.search).get('debug') === 'whole-deck';
        // Two names on purpose: appVersion is what the user is shown, version is what
        // goes on every asset URL - under debug it carries a random cache-buster, which
        // has no business appearing in the title.
        const appVersion = '1.64.3';
        const version = appVersion
            +(debug?'&_='+Math.random():'');
        // Under debug the photographed card is rendered beside the transcription, which
        // is the audit the project actually runs on (AGENTS.md section 2).
        const useHumanCharacterImages = debug;
        const useAiCharacterImages = debug;
        // 16 = every character in the roster, so debug can seat them all at once.
        let maxPlayers = debug ? 16: 4;

        var s = document.createElement('script');
        s.src = './assets/js/main.js?' + version;
        document.head.appendChild(s);

        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = './assets/css/main.css?' + version;
        document.head.appendChild(link);
    </script>
</head>
<body>
<div class="container" id="container">
    <h1 id="mainTitle"><span class="titleLine">Star Wars Outer Rim</span><span class="titleLine" id="mainTitleSub">Automa Simulator</span></h1>

    <div id="step1">
        <h2 id="gameModeHeading">Select Game Mode</h2>
        <select id="gameMode">
            <option value="expansion" selected>Unfinished Business Expansion</option>
            <option value="base">Base Game Only</option>
        </select>
        <div id="localePicker" role="radiogroup"></div>
        <button id="nextToPlayers">Next</button>
        <p id="disclaimer"></p>
    </div>

    <div id="step2" class="hidden">
        <h2 id="addPlayerHeading">Add Player #1</h2>
        <select id="playerType">
            <option value="human">Human Player</option>
            <option value="ai">AI Player</option>
        </select>

        <select id="playerCharacter"></select>
        <button id="randomCharacter">Random character</button>
        <input type="text" id="playerNickname" placeholder="Player 1" maxlength="16">
        <select id="playerColor"></select>
        <div id="playerFormError" style="color: #ff5555; margin: 5px 0; display: none;"></div>

        <div class="setupActions">
            <button id="addAnother">Add Another Player</button>
            <button id="goToGame">Start Game</button>
            <button id="backPlayer">Back</button>
        </div>
    </div>

    <div id="gameStep" class="hidden">
        <div class="header-row">
            <button id="helpButton" title="Help">?</button>
            <h2 id="turnHeader"></h2>
            <div id="helpControls" class="hidden">
                <button id="exitDebugButton" class="hidden" title="Exit debug mode">&#9099;</button>
                <button id="keepAwakeToggle" title="Keep screen awake">☀</button>
                <button id="localeToggle" title="Switch language">UK</button>
                <select id="refDocs" title="Open a rulebook in a new tab">
                    <option value="">Rulebook…</option>
                    <option value="assets/ref_docs/swor-base.pdf">Learn to Play (EN)</option>
                    <option value="assets/ref_docs/swor-outerrim.pdf">Unfinished Business (EN)</option>
                    <option value="assets/ref_docs/swor_living_rules_reference.pdf">Rules Reference (EN)</option>
                    <option value="assets/ref_docs/swor-base-ukr.pdf">Правила (UK)</option>
                </select>
            </div>
            <button id="fullscreenButton" title="Toggle fullscreen">⛶</button>
        </div>
        <div id="cardDisplay"></div>
    </div>
</div>

</body>
</html>
